apiVersion: apps/v1
kind: Deployment

metadata:
  name: reliable-api
  namespace: sre-platform

  labels:
    app: reliable-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: reliable-api

  template:
    metadata:
      labels:
        app: reliable-api

    spec:
      containers:
        - name: reliable-api

          image: reliable-api:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: FAILURE_MODE
              value: "false"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3